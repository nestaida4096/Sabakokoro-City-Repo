<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来市公式ホームページ - 記事ページ</title>
  
  <!-- jQueryの読み込み -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  
  <!-- MarkdownをHTMLに解析・変換する「marked.js」の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ==========================================================================
       共通の基本設定・変数定義
       ========================================================================== */
    :root {
      --primary-color: #0c3e66; /* 行政向けの信頼感あるブルー */
      --secondary-color: #2b6cb0;
      --bg-color-light: #f7fafc;
      --text-color: #2d3748;
      --text-color-light: #718096;
      --border-color: #e2e8f0;
      --container-width: 1100px;
      --font-size-base: 16px;
    }

    /* 高コントラスト（白黒反転）テーマ用 */
    body.theme-contrast {
      --primary-color: #ffffff;
      --secondary-color: #ffff00;
      --bg-color-light: #121212;
      --text-color: #ffffff;
      --text-color-light: #e2e8f0;
      --border-color: #ffffff;
      background-color: #000000;
      color: #ffffff;
    }

    /* 文字サイズ拡大用 */
    body.font-large {
      --font-size-base: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.7;
      color: var(--text-color);
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: var(--container-width);
      margin: 0 auto;
      padding: 0 15px;
    }

    .flex-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--secondary-color);
      text-decoration: underline;
    }
    a:hover {
      text-decoration: none;
    }

    /* ==========================================================================
       1. ヘッダー調整用スタイル
       ========================================================================== */
    .gov-header {
      background-color: #ffffff;
      border-bottom: 3px solid var(--primary-color);
    }
    body.theme-contrast .gov-header {
      background-color: #000000;
      border-bottom: 3px solid var(--border-color);
    }
    .accessibility-bar {
      background-color: var(--bg-color-light);
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85em;
    }
    .accessibility-controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-right: 15px;
    }
    .control-label {
      font-weight: bold;
    }
    .btn-control {
      background-color: #ffffff;
      border: 1px solid var(--text-color-light);
      color: var(--text-color);
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9em;
    }
    body.theme-contrast .btn-control {
      background-color: #000000;
      color: #ffffff;
      border-color: #ffffff;
    }
    .btn-control.active {
      background-color: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }
    body.theme-contrast .btn-control.active {
      background-color: #ffffff;
      color: #000000;
    }
    .main-header {
      padding: 20px 0;
    }
    .logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--primary-color);
      gap: 12px;
    }
    body.theme-contrast .logo-link {
      color: #ffffff;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .main-title {
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .sub-title {
      font-size: 0.75em;
      color: var(--text-color-light);
    }
    .search-form {
      display: flex;
      border: 2px solid var(--primary-color);
      border-radius: 4px;
      overflow: hidden;
    }
    body.theme-contrast .search-form {
      border-color: #ffffff;
    }
    .search-input {
      border: none;
      padding: 8px 12px;
      font-size: 0.95em;
      outline: none;
    }
    .search-submit {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    body.theme-contrast .search-submit {
      background-color: #ffffff;
      color: #000000;
    }
    .global-nav {
      background-color: var(--primary-color);
    }
    body.theme-contrast .global-nav {
      background-color: #000000;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-list {
      display: flex;
      list-style: none;
      justify-content: space-between;
      overflow-x: auto;
    }
    .nav-item {
      display: block;
      padding: 14px 16px;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }
    .nav-item:hover, .nav-item:focus {
      background-color: var(--secondary-color);
    }

    /* ==========================================================================
       2. フッター調整用スタイル
       ========================================================================== */
    .gov-footer {
      background-color: var(--bg-color-light);
      border-top: 4px solid var(--primary-color);
      padding: 40px 0 20px;
      margin-top: auto;
    }
    body.theme-contrast .gov-footer {
      background-color: #000000;
      border-top: 4px solid var(--border-color);
    }
    .footer-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 30px;
    }
    .footer-title {
      font-size: 1.3em;
      font-weight: bold;
      color: var(--primary-color);
      display: block;
      margin-bottom: 15px;
    }
    body.theme-contrast .footer-title {
      color: #ffffff;
    }
    .footer-info p {
      font-size: 0.9em;
      color: var(--text-color);
      margin-bottom: 8px;
    }
    .footer-links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .column-title {
      font-size: 1em;
      border-left: 3px solid var(--primary-color);
      padding-left: 8px;
      margin-bottom: 15px;
      color: var(--primary-color);
    }
    body.theme-contrast .column-title {
      border-left-color: #ffffff;
      color: #ffffff;
    }
    .links-column ul {
      list-style: none;
    }
    .links-column li {
      margin-bottom: 10px;
      font-size: 0.9em;
    }
    .links-column a {
      color: var(--text-color);
    }
    .footer-bottom {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
      text-align: center;
      font-size: 0.85em;
    }

    /* ==========================================================================
       3. メインレイアウト & マークダウン装飾
       ========================================================================== */
    .main-wrapper {
      flex: 1;
      padding: 40px 0;
    }
    .markdown-container {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px;
    }
    body.theme-contrast .markdown-container {
      background-color: #000000;
      border-color: #ffffff;
    }

    /* 変換後の見栄えを整えるマークダウン専用CSS */
    .markdown-body h1 {
      font-size: 2em;
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    body.theme-contrast .markdown-body h1 {
      color: #ffffff;
      border-bottom-color: #ffffff;
    }
    .markdown-body h2 {
      font-size: 1.5em;
      color: var(--primary-color);
      border-left: 5px solid var(--primary-color);
      padding-left: 12px;
      margin-top: 40px;
      margin-bottom: 20px;
    }
    body.theme-contrast .markdown-body h2 {
      color: #ffffff;
      border-left-color: #ffffff;
    }
    .markdown-body h3 {
      font-size: 1.2em;
      margin-top: 30px;
      margin-bottom: 15px;
      position: relative;
      padding-left: 15px;
    }
    .markdown-body h3::before {
      content: "■";
      color: var(--secondary-color);
      position: absolute;
      left: 0;
    }
    .markdown-body p {
      margin-bottom: 20px;
    }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 25px;
      padding-left: 25px;
    }
    .markdown-body li {
      margin-bottom: 8px;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      margin-bottom: 30px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 12px;
      text-align: left;
    }
    .markdown-body th {
      background-color: var(--bg-color-light);
      font-weight: bold;
    }
    body.theme-contrast .markdown-body th {
      background-color: #222222;
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--secondary-color);
      padding: 15px 20px;
      background-color: var(--bg-color-light);
      margin-bottom: 25px;
      color: var(--text-color-light);
    }
    body.theme-contrast .markdown-body blockquote {
      background-color: #111111;
      border-left-color: #ffffff;
      color: #ffffff;
    }
    .markdown-body strong {
      color: #e53e3e;
    }
    body.theme-contrast .markdown-body strong {
      color: #ffff00;
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      .flex-container {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .search-area {
        width: 100%;
      }
      .search-form {
        width: 100%;
      }
      .search-input {
        flex: 1;
      }
      .footer-content {
        grid-template-columns: 1fr;
      }
      .footer-links-grid {
        grid-template-columns: 1fr;
      }
      .markdown-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー挿入エリア -->
  <div id="header-container"></div>

  <!-- メインコンテンツ -->
  <main class="main-wrapper">
    <div class="container">
      <article class="markdown-container">
        <!-- 
          ここにMarkdownテキストを直接記述（ハードコード）します。
          「textarea」または「script(type="text/markdown")」内に書くことで、
          余計な改行やブラウザによる自動レンダリングを防ぎ、そのままmarked.jsに渡せます。
        -->
        <script type="text/markdown" id="markdown-raw">
## 隣の行政である「加山帝国」内の制度に関する懸念の表明
- 直近に設立された「加山帝国」において、以下の事象が存在する可能性があり、鯖心特別市として懸念しています。
### 「入国」制度
- 加山帝国は、名前でこそ帝国と名乗っていますが、区分上は「都」であり国ではありません。よって、出入国管理局を設置するのは適切ではありません。
### 境界にある塀の存在
- 鯖心特別市と加山帝国間にはとても高いブロック塀があり、これは加山帝国の内情を外から確認できぬようシャットアウトしている、という理由で設置されたものとみられ、その存在は倒壊の危険性も否定できませんが、また内情を見せられないという理由があるはずです。
### 結論
- このことから、加山帝国の存在はあまり好ましいものではなく、鯖心特別市としては塀の撤去および出入国管理局を設置するのは不適当です。

        </script>

        <!-- MarkdownがHTMLに変換されて描画される実際のコンテナ -->
        <div id="markdown-content" class="markdown-body"></div>
      </article>
    </div>
  </main>

  <!-- フッター挿入エリア -->
  <div id="footer-container"></div>

  <!-- スクリプト制御 -->
  <script>
    $(document).ready(function() {
      // 1. パスのルート指定（GitHub Pages等の展開先にあわせて相対的に自動決定）
      const basePath = "https://nestaida.github.io/Sabakokoro-City-Repo/";

      // 2. ヘッダーとフッターのロード（jQuery）
      $('#header-container').load(basePath + 'header.html', function(response, status) {
        if (status !== "error") {
          initAccessibilityEvents();
        }
      });
      $('#footer-container').load(basePath + 'footer.html');

      // 3. ハードコードされたMarkdownを取得し、marked.js で解析して描画
      const rawMarkdown = $('#markdown-raw').html();
      const htmlContent = marked.parse(rawMarkdown);
      $('#markdown-content').html(htmlContent);

      // タイトルの自動補正
      const pageTitle = "隣の行政である「加山帝国」内の制度に関する懸念の表明";
      if (pageTitle) {
        document.title = pageTitle + " - 鯖心特別市公式ホームページ";
      }

      // 4. アクセシビリティ機能（文字サイズ・テーマカラー切り替え）の制御
      function initAccessibilityEvents() {
        $('#btn-size-normal').on('click', function() {
          $('body').removeClass('font-large');
          $('.accessibility-controls:nth-child(1) .btn-control').removeClass('active');
          $(this).addClass('active');
        });

        $('#btn-size-large').on('click', function() {
          $('body').addClass('font-large');
          $('.accessibility-controls:nth-child(1) .btn-control').removeClass('active');
          $(this).addClass('active');
        });

        $('#btn-theme-default').on('click', function() {
          $('body').removeClass('theme-contrast');
          $('.accessibility-controls:nth-child(2) .btn-control').removeClass('active');
          $(this).addClass('active');
        });

        $('#btn-theme-contrast').on('click', function() {
          $('body').addClass('theme-contrast');
          $('.accessibility-controls:nth-child(2) .btn-control').removeClass('active');
          $(this).addClass('active');
        });
      }
    });
  </script>
</body>
</html>
